# The published baseline every revision under ./breaking and ./not-breaking is
# diffed against by ../../src/diff.test.ts.
#
# It doubles as the input to the gate-order integration test, so it satisfies
# every rule in ../../rulesets/house.spectral.yaml as well: a base that failed
# the lint gate would stop the composed run before the diff gate was ever
# reached, and the diff gate would then read as passing.
#
# Shaped after the contract in .specs/01-bare-minimal-api-governance-poc.md so
# the cases below read as changes someone would actually propose to the API
# being governed. OpenAPI 3.0.3, matching ../valid/satisfies-all-rules.yaml.
openapi: 3.0.3
info:
  title: Fixture - diff baseline
  version: 1.0.0
paths:
  /companies/{companyId}/dashboard:
    get:
      operationId: getCompanyDashboard
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The dashboard payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '404':
          description: No such company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /companies/{companyId}/spend-limit:
    put:
      operationId: replaceSpendLimit
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendLimitUpdate'
      responses:
        '200':
          description: The stored spend limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendLimit'
        '404':
          description: No such company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Dashboard:
      type: object
      additionalProperties: false
      required: [card]
      properties:
        card:
          $ref: '#/components/schemas/Card'
    Card:
      type: object
      additionalProperties: false
      required: [lastFour, state]
      properties:
        # Required, so removing it is breaking. Removing the optional
        # cardArtRef below is not, which is what makes the pair worth having.
        lastFour:
          type: string
        state:
          $ref: '#/components/schemas/CardState'
        cardArtRef:
          type: string
    CardState:
      type: string
      enum: [active, frozen, unknown]
    SpendLimitUpdate:
      type: object
      additionalProperties: false
      required: [minorUnits, currency]
      properties:
        # Deliberately wider than the repo's integer-minor-units convention:
        # tightening it to `integer` is the narrowing the breaking fixture
        # makes, and it is the kind of change that reads as a correction and
        # rejects a consumer already sending 1000.50.
        minorUnits:
          type: number
        currency:
          type: string
    SpendLimit:
      type: object
      additionalProperties: false
      required: [minorUnits, currency]
      properties:
        minorUnits:
          type: integer
        currency:
          type: string
