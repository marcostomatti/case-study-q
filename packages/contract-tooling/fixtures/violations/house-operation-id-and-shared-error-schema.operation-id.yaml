# Violates rule 5 (house-operation-id-and-shared-error-schema), `operationId`
# leg: the operation has no operationId, so it cannot be keyed in `api_usage`
# and spec section 6.4 cannot answer who is calling it.
#
# The 404 here deliberately DOES reference the shared Error schema, so this
# fixture isolates the first `then` entry from the second. The unshared-error
# fixture beside it isolates the second.
#
# Compliant elsewhere: Error declares its type and additionalProperties
# (rules 1-2), no enum, nothing deprecated, no nullable.
openapi: 3.0.3
info:
  title: Fixture - violates house-operation-id-and-shared-error-schema (operationId)
  version: 1.0.0
paths:
  /companies:
    get:
      responses:
        '200':
          description: Companies.
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
