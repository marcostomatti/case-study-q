# Installs the two gate binaries at pinned versions.
#
# Both are single static Go binaries with no runtime, which is precisely why
# the schema gates can run on a GitHub-hosted runner instead of needing a
# self-hosted one. This repository is public and must stay that way for review.
#
# The versions are inputs with pinned defaults rather than a `latest` fetch.
# `vacuum` gains and tightens rules between releases, so an unpinned install
# makes the lint gate change its mind between runs of an unchanged tree — which
# reads as flakiness rather than as the upgrade it is.
#
# Three jobs need these, so this exists to keep one copy of the install rather
# than three that drift.

name: Gate binaries
description: Install pinned vacuum and oasdiff onto PATH.

inputs:
  vacuum-version:
    description: vacuum release to install.
    required: false
    default: "0.30.3"
  oasdiff-version:
    description: oasdiff release to install.
    required: false
    default: "1.31.0"

runs:
  using: composite
  steps:
    - name: Install vacuum and oasdiff
      shell: bash
      env:
        VACUUM_VERSION: ${{ inputs.vacuum-version }}
        OASDIFF_VERSION: ${{ inputs.oasdiff-version }}
      run: |
        set -euo pipefail

        mkdir -p "${RUNNER_TEMP}/gate-bin"

        curl -fsSL \
          "https://github.com/daveshanley/vacuum/releases/download/v${VACUUM_VERSION}/vacuum_${VACUUM_VERSION}_linux_x86_64.tar.gz" \
          | tar -xz -C "${RUNNER_TEMP}/gate-bin" vacuum
        # vacuum publishes linux_x86_64, NOT linux_amd64. oasdiff publishes
        # linux_amd64. Guessing one naming for both 404s on half the installs.

        curl -fsSL \
          "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
          | tar -xz -C "${RUNNER_TEMP}/gate-bin" oasdiff

        chmod +x "${RUNNER_TEMP}/gate-bin/vacuum" "${RUNNER_TEMP}/gate-bin/oasdiff"
        echo "${RUNNER_TEMP}/gate-bin" >> "${GITHUB_PATH}"

    - name: Report the versions the gates will run at
      shell: bash
      run: |
        set -euo pipefail
        # Proves the binaries are on PATH and runnable before any gate needs
        # them. A gate binary that is missing fails with a spawn ENOENT deep
        # inside a suite, which reads as a test failure rather than as setup.
        echo "vacuum  $(vacuum version)"
        oasdiff --version
